name: Deploy to SmarterASP.NET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: dotnet publish SubliminalCart3lBot.csproj --configuration Release --output ./release

      - name: Deploy with WebDeploy
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeployPaths = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $msdeploy = $msdeployPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) {
            throw "Microsoft WebDeploy (msdeploy.exe) was not found on this runner."
          }

          $sourcePath = (Resolve-Path -LiteralPath "./release").Path
          $siteName = $env:WEBSITE_NAME
          if ([string]::IsNullOrWhiteSpace($siteName)) {
            $siteName = "subliminalcart3l-001-site1"
          } else {
            $siteName = $siteName.Trim()
          }
          if ($siteName -ne "subliminalcart3l-001-site1") {
            throw "WEBSITE_NAME does not match the configured SmarterASP site."
          }

          $computerName = $env:SERVER_COMPUTER_NAME
          $username = $env:SERVER_USERNAME
          $password = $env:SERVER_PASSWORD
          $deployArguments = @(
            "-verb:sync"
            "-source:contentPath=$sourcePath"
            "-dest:contentPath=$siteName,computerName=$computerName,userName=$username,password=$password,authType=Basic"
            "-allowUntrusted"
            "-enableRule:AppOffline"
            "-enableRule:DoNotDeleteRule"
          )
          & $msdeploy `
            @deployArguments

          if ($LASTEXITCODE -ne 0) {
            throw "WebDeploy failed with exit code $LASTEXITCODE."
          }